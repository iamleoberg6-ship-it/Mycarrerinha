<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mycarrerinha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Montserrat:wght@700;800;900&family=Oswald:wght@600;700&family=Bebas+Neue&family=Saira+Condensed:wght@700;800&family=Archivo+Black&family=Teko:wght@600;700&display=swap">
<style>
/* Semana do jogador: cartão do jogador no topo, a semana planejada dia a dia, o jogo como uma narração com decisões e o resumo no fim. Mesma linguagem das outras telas. */
:root {
  --campo: #0C1A17; --campo-2: #13261F; --campo-3: #1A3129; --linha: #2B4239;
  --giz: #EDF2EB; --giz-2: #A3B6AD; --ouro: #E3B341; --ouro-claro: #F6DC8A; --ouro-escuro: #6E5317;
  --tinta: #241A06; --pos: #74D394; --neg: #EC7D69;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --texto: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--campo); color: var(--giz); font-family: var(--texto); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--campo); }
button { font: inherit; color: inherit; }
a { color: var(--ouro-claro); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.pagina { max-width: 640px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.marca { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.marca strong { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; color: var(--ouro); }
.marca span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--giz-2); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(32px, 8.5vw, 46px); line-height: 1.02; text-transform: uppercase; text-wrap: balance; }
h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.rotulo { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--giz-2); font-weight: 600; margin: 0; }
.sub { margin: 0; color: var(--giz-2); font-size: 14px; }
.painel { background: var(--campo-2); border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; }
.botao { background: var(--ouro); color: var(--tinta); border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.botao:hover:not(:disabled) { filter: brightness(1.06); }
.botao:disabled { opacity: .45; cursor: not-allowed; }
.botao.sec { background: var(--campo-3); color: var(--giz); border: 1px solid var(--linha); }
.botao.grande { padding: 16px; font-size: 18px; width: 100%; }
.botao.peq { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: transparent; border: 1px solid var(--linha); color: var(--giz-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.chip.ativo { border-color: var(--ouro); color: var(--tinta); background: var(--ouro); font-weight: 600; }

/* jogador */
.jogador { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; }
.jogador .foto { width: 84px; height: 100px; border-radius: 12px; overflow: hidden; background: var(--campo-3); }
.jogador .foto svg { width: 100%; height: 100%; display: block; }
.jogador .nome { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; }
.jogador .det { font-size: 13px; color: var(--giz-2); }
.ovr { text-align: center; }
.ovr strong { display: block; font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; color: var(--ouro-claro); }
.ovr span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--giz-2); }
.barras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 12px; }
.barra { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; color: var(--giz-2); }
.barra b { color: var(--giz); font-weight: 600; font-variant-numeric: tabular-nums; }
.barra i { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--linha); overflow: hidden; display: block; }
.barra i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--c, var(--giz-2)); border-radius: 3px; }
.linha-info { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--giz-2); margin-top: 10px; }
.linha-info b { color: var(--giz); font-weight: 600; }

/* semana */
.jogo-card { display: flex; flex-direction: column; gap: 8px; }
.confronto { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.time { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; line-height: 1.15; }
.time.dir { justify-content: flex-end; text-align: right; }
.escudo { width: 26px; height: 30px; flex: none; }
.vs { font-family: var(--display); font-weight: 800; color: var(--giz-2); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--campo-3); border: 1px solid var(--linha); }
.tag.titular { background: #1F4D33; border-color: #2F7A4F; color: #BFF0D0; }
.tag.banco { background: #4A3C14; border-color: var(--ouro-escuro); color: var(--ouro-claro); }
.tag.ruim { background: #4D2420; border-color: #7A3A33; color: #F6C2B8; }
.dias { display: flex; flex-direction: column; gap: 8px; }
.dia { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; }
.dia > span { font-size: 13px; font-weight: 600; color: var(--giz-2); }
.dia .chips { margin-right: -16px; padding-right: 16px; }
.previa { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--giz-2); padding-top: 4px; }
.previa b { color: var(--giz); }
.grupo-plano { display: flex; flex-direction: column; gap: 8px; }
.grade-semana { display: grid; grid-template-columns: 1fr repeat(7, 32px); gap: 4px 3px; align-items: center; }
.grade-semana .cel.travado { display: block; height: 32px; border-radius: 8px; background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 4px, transparent 4px 8px); border: 1px dashed var(--linha); }
.grade-semana .cab.jogo, .grade-semana .cab.trav { color: var(--giz-2); opacity: .9; } .grade-semana .cab.jogo small { color: var(--ouro); }
.dia-jogo { color: var(--ouro) !important; }
.jogo-copa { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--linha); }
.jogo-copa span:last-child { text-align: right; } .jogo-copa > b, .jogo-copa > .sub { text-align: center; }
.jogo-copa.meu, .serie.meu .jogo-copa { color: var(--ouro-claro); }
.jogo-copa .venc { font-weight: 700; color: var(--giz); } .serie { padding: 2px 0 6px; } .serie small { display: block; font-size: 11px; }
tr.z-dir td:first-child { box-shadow: inset 3px 0 0 #74D394; } tr.z-play td:first-child { box-shadow: inset 3px 0 0 #E3B341; } tr.z-fora td { opacity: .7; }
.grade-semana .cab { text-align: center; font-size: 12px; font-weight: 700; color: var(--giz-2); line-height: 1.1; }
.grade-semana .cab small { display: block; font-size: 9px; font-weight: 600; color: var(--ouro); text-transform: uppercase; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.grade-semana .acao { font-size: 14px; font-weight: 600; line-height: 1.15; padding: 4px 0; }
.grade-semana .acao small { display: block; font-size: 11px; font-weight: 400; color: var(--giz-2); }
.cel { width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--linha); background: var(--campo); cursor: pointer; position: relative; }
.cel::after { content: ""; position: absolute; inset: 0; margin: auto; width: 10px; height: 10px; border-radius: 50%; background: var(--linha); }
.cel.ativo { background: var(--ouro); border-color: var(--ouro); }
.cel.ativo::after { background: var(--tinta); width: 12px; height: 12px; }

.abas { display: grid; grid-template-columns: repeat(6, 1fr); position: sticky; top: 6px; z-index: 20; box-shadow: 0 6px 18px rgba(0,0,0,.35); background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 4px; gap: 4px; }
.abas button { background: none; border: 0; border-radius: 9px; padding: 9px 2px; font-weight: 600; font-size: 11.5px; color: var(--giz-2); cursor: pointer; }
.abas button.ativo { background: var(--ouro); color: var(--tinta); }
.fixo-jogar { position: sticky; bottom: 12px; z-index: 19; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
/* evolução */
.evo-chips { flex-wrap: wrap; margin-bottom: 8px; } .evo-chips .chip { padding: 5px 11px; font-size: 12px; }
svg.evo { width: 100%; height: auto; display: block; background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; }
.evo-grade { stroke: var(--linha); stroke-dasharray: 3 4; } .evo-eixo { fill: var(--giz-2); font-size: 10px; font-family: var(--texto); } .evo-eixo.agora { fill: var(--ouro); font-weight: 700; }
.evo-linha { fill: none; stroke: var(--ouro); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; } .evo-area { fill: var(--ouro); opacity: .12; }
.evo-ponto { fill: var(--campo); stroke: var(--ouro); stroke-width: 2; } .evo-max { fill: var(--ouro-claro); stroke: var(--campo); stroke-width: 2; } .evo-agora { fill: var(--ouro); stroke: var(--giz); stroke-width: 2; }
.evo-leg { margin: 6px 0 14px; } .evo-leg .pos { color: #74D394; } .evo-leg .neg { color: var(--neg); }
/* saúde */
.corpo-card { background: var(--campo-2); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; }
.corpo-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; } .corpo-topo h2 { margin: 2px 0 0; }
.corpo-idade { text-align: right; } .corpo-idade b { display: block; font-family: var(--display); font-size: 34px; font-weight: 900; line-height: 1; } .corpo-idade small { color: var(--giz-2); font-size: 11px; }
.barra-corpo { height: 10px; border-radius: 6px; background: var(--campo-3); overflow: hidden; margin-top: 10px; } .barra-corpo i { display: block; height: 100%; border-radius: 6px; }
.cronica { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--campo-2); border-left: 3px solid #E3B341; margin-bottom: 8px; } .cronica.n2 { border-left-color: #F09A5B; } .cronica.n3 { border-left-color: var(--neg); }
.cronica small, .staff small, .empresa small, .abrir-emp small, .invest small { display: block; color: var(--giz-2); font-size: 12.5px; }
.staff { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 10px; margin-bottom: 8px; } .staff.on { border-color: #2F6B45; background: rgba(116,211,148,.06); }
.staff .botao small, .abrir-emp .botao small { display: block; font-size: 10.5px; opacity: .8; color: inherit; }
/* negócios */
.prop-neg { border-color: var(--ouro); } .prop-neg.suspeita { border-color: var(--neg); } .assessor { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--campo-3); font-size: 14px; }
.empresa { padding: 12px; border: 1px solid var(--linha); border-radius: 12px; margin-bottom: 10px; background: var(--campo-2); }
.emp-topo { display: flex; justify-content: space-between; gap: 10px; } .emp-valor { text-align: right; white-space: nowrap; }
.emp-saude { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; font-size: 12px; color: var(--giz-2); margin: 8px 0; }
.abrir-emp { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linha); } .abrir-emp.trava { opacity: .55; } .abrir-emp .falta { color: var(--ouro-claro); }
.invest { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linha); } .invest .ferr-botoes { grid-column: 1 / -1; margin: 0; } .inv-v { font-variant-numeric: tabular-nums; }
/* redes */
.entrevista { border-color: var(--ouro); } .entrevista h2 { font-size: 20px; text-transform: none; font-family: var(--texto); font-weight: 700; }
.entrevista .ops { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; } .entrevista .ops button { text-align: left; background: var(--campo-3); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; color: var(--giz); font: inherit; } .entrevista .ops button:hover { border-color: var(--ouro); } .entrevista .ops small { color: var(--giz-2); }
.assunto { margin: 10px 0 0; font-size: 14px; color: var(--giz-2); } .assunto b { color: #6FB7E0; }
.feed { display: flex; flex-direction: column; gap: 8px; } .post { padding: 10px 12px; border-radius: 12px; background: var(--campo-2); border: 1px solid var(--linha); } .post.tom1 { border-left: 3px solid #74D394; } .post.tom-1 { border-left: 3px solid var(--neg); }
.post-topo { display: flex; gap: 6px; align-items: baseline; font-size: 13px; } .post-topo small { color: var(--giz-2); } .post p { margin: 4px 0; font-size: 14.5px; white-space: pre-line; } .post-cur { color: var(--giz-2); font-size: 12px; }
.posts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .post-op { text-align: left; background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; color: var(--giz); font: inherit; cursor: pointer; } .post-op:hover { border-color: var(--ouro); } .post-op b { display: block; font-size: 14px; } .post-op small { color: var(--giz-2); font-size: 12px; }
/* namoro */
.sobre-ela { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; } .sobre-ela small { color: var(--giz-2); font-size: 12.5px; } .sobre-ela small b { color: #F3B6CC; font-weight: 600; } .sobre-ela .pensa { color: var(--giz); font-style: italic; }
.chat { margin: 8px 0; } details.chat > summary { cursor: pointer; font-size: 13px; color: #E58FB1; font-weight: 600; padding: 6px 0; } details.chat > summary b { color: var(--ouro); }
.chat-hist { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 8px; }
.bolha.eu { align-self: flex-end; background: #1E3A4A; border-color: #2F6688; border-radius: 14px 14px 4px 14px; }
.bolha.eu small { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; } .bolha.eu small.pos { color: var(--pos); } .bolha.eu small.neg { color: var(--neg); }
.chat-respostas { display: grid; gap: 6px; }
.chat-respostas button { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; background: var(--campo-3); color: var(--giz); border: 1px solid var(--linha); border-radius: 12px; padding: 9px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.chat-respostas button:hover { border-color: #E58FB1; } .chat-respostas small { color: var(--giz-2); font-size: 11px; white-space: nowrap; }
.chat-fim { margin: 4px 0 0; } details.mais-programas { width: 100%; } details.mais-programas > summary { list-style: none; display: inline-block; cursor: pointer; } details.mais-programas > summary::-webkit-details-marker { display: none; } .bolha { align-self: flex-start; max-width: 88%; background: #3A2433; border: 1px solid #6B3A55; border-radius: 14px 14px 14px 4px; padding: 9px 12px; font-size: 14.5px; }
.chat-ops { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; } .chat-ops .chip { font-size: 12.5px; padding: 6px 10px; }
.escolha-nam { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border: 1px dashed #6B3A55; border-radius: 12px; } .escolha-nam .rotulo { width: 100%; margin: 0; } .escolha-nam .chip { font-size: 12.5px; padding: 6px 10px; }
.cena { margin: 8px 0; padding: 12px; border-radius: 12px; border: 1px solid #E58FB1; background: rgba(229,143,177,.07); } .cena p { margin: 4px 0; } .cena .ops { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; } .cena .ops button { text-align: left; background: var(--campo-3); border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; color: var(--giz); font: inherit; cursor: pointer; display: flex; justify-content: space-between; } .cena .ops button:hover { border-color: #E58FB1; } .cena .ops small { color: var(--giz-2); }
/* aba Vida */
.sub-abas.rolar { overflow-x: auto; scrollbar-width: none; } .sub-abas.rolar::-webkit-scrollbar { display: none; } .sub-abas.rolar button { flex: 1 0 auto; padding: 10px 7px 8px; font-size: 12px; }
.ocasiao { border-color: var(--linha); } .ocasiao h2 { font-size: 20px; margin: 4px 0; } .ocasiao .rotulo { display: flex; justify-content: space-between; gap: 8px; } .ocasiao .prazo { color: var(--giz-2); text-transform: none; letter-spacing: 0; font-weight: 500; }
.ocasiao .ops { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; } .ocasiao .ops button { text-align: left; background: var(--campo-3); border: 1px solid var(--linha); border-radius: 12px; padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; color: var(--giz); font: inherit; } .ocasiao .ops button:hover { border-color: var(--ouro); } .ocasiao .ops small { color: var(--giz-2); }
.ocasiao.o-familia, .ocasiao.o-filho { border-left: 3px solid #F3B6CC; } .ocasiao.o-encrenca { border-left: 3px solid var(--neg); } .ocasiao.o-convite { border-left: 3px solid var(--ouro); } .ocasiao.o-parca { border-left: 3px solid #6FB7E0; } .ocasiao.o-ferias, .ocasiao.o-exterior { border-left: 3px solid #74D394; } .ocasiao.o-fundacao { border-left: 3px solid #E58FB1; }
.ocasiao.feita p { margin: 0; color: var(--ouro-claro); }
.luto { border-color: #8A968E; } .luto p { margin: 0; }
.parca { padding: 12px; border: 1px solid var(--linha); border-radius: 12px; margin-bottom: 10px; background: var(--campo-2); } .parca-topo { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; } .parca-topo small { display: block; color: var(--giz-2); font-size: 12.5px; }
.luxo { display: grid; grid-template-columns: 32px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linha); } .luxo-ic { font-size: 24px; } .luxo small { display: block; color: var(--giz-2); font-size: 12px; } .luxo small.pos { color: #74D394; } .luxo small.neg { color: var(--neg); }
.hobbies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .hobby { position: relative; overflow: hidden; text-align: left; background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px 12px; color: var(--giz); font: inherit; cursor: pointer; } .hobby.on { border-color: var(--ouro); background: rgba(227,179,65,.08); }
.hobby span { font-size: 22px; } .hobby b { display: block; font-size: 14px; } .hobby small { color: var(--giz-2); font-size: 12px; } .hobby i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ouro); }
.curso { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 12px; border: 1px solid #2E5A7A; border-radius: 12px; background: rgba(111,183,224,.06); } .curso small { display: block; color: var(--giz-2); font-size: 12.5px; } .curso .chip { justify-self: start; }
.selo.alerta { background: rgba(236,125,105,.18); color: #F6C2B8; } .em-memoria { opacity: .7; }
/* linha da vida */
.vida { position: relative; margin: 6px 0 16px; padding-left: 16px; border-left: 2px solid var(--linha); display: flex; flex-direction: column; gap: 14px; }
