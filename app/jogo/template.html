<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mycarrerinha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Semana do jogador: cartão do jogador no topo, a semana planejada dia a dia, o jogo como uma narração com decisões e o resumo no fim. Mesma linguagem das outras telas. */
:root {
  --campo: #0C1A17; --campo-2: #13261F; --campo-3: #1A3129; --linha: #2B4239;
  --giz: #EDF2EB; --giz-2: #A3B6AD; --ouro: #E3B341; --ouro-claro: #F6DC8A; --ouro-escuro: #6E5317;
  --tinta: #241A06; --pos: #74D394; --neg: #EC7D69;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --texto: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--campo); color: var(--giz); font-family: var(--texto); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--campo); }
button { font: inherit; color: inherit; }
a { color: var(--ouro-claro); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.pagina { max-width: 640px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.marca { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.marca strong { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; color: var(--ouro); }
.marca span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--giz-2); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(32px, 8.5vw, 46px); line-height: 1.02; text-transform: uppercase; text-wrap: balance; }
h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.rotulo { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--giz-2); font-weight: 600; margin: 0; }
.sub { margin: 0; color: var(--giz-2); font-size: 14px; }
.painel { background: var(--campo-2); border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; }
.botao { background: var(--ouro); color: var(--tinta); border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.botao:hover:not(:disabled) { filter: brightness(1.06); }
.botao:disabled { opacity: .45; cursor: not-allowed; }
.botao.sec { background: var(--campo-3); color: var(--giz); border: 1px solid var(--linha); }
.botao.grande { padding: 16px; font-size: 18px; width: 100%; }
.botao.peq { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: transparent; border: 1px solid var(--linha); color: var(--giz-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.chip.ativo { border-color: var(--ouro); color: var(--tinta); background: var(--ouro); font-weight: 600; }

/* jogador */
.jogador { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; }
.jogador .foto { width: 84px; height: 100px; border-radius: 12px; overflow: hidden; background: var(--campo-3); }
.jogador .foto svg { width: 100%; height: 100%; display: block; }
.jogador .nome { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; }
.jogador .det { font-size: 13px; color: var(--giz-2); }
.ovr { text-align: center; }
.ovr strong { display: block; font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; color: var(--ouro-claro); }
.ovr span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--giz-2); }
.barras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 12px; }
.barra { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; color: var(--giz-2); }
.barra b { color: var(--giz); font-weight: 600; font-variant-numeric: tabular-nums; }
.barra i { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--linha); overflow: hidden; display: block; }
.barra i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--c, var(--giz-2)); border-radius: 3px; }
.linha-info { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--giz-2); margin-top: 10px; }
.linha-info b { color: var(--giz); font-weight: 600; }

/* semana */
.jogo-card { display: flex; flex-direction: column; gap: 8px; }
.confronto { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.time { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; line-height: 1.15; }
.time.dir { justify-content: flex-end; text-align: right; }
.escudo { width: 26px; height: 30px; flex: none; }
.vs { font-family: var(--display); font-weight: 800; color: var(--giz-2); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--campo-3); border: 1px solid var(--linha); }
.tag.titular { background: #1F4D33; border-color: #2F7A4F; color: #BFF0D0; }
.tag.banco { background: #4A3C14; border-color: var(--ouro-escuro); color: var(--ouro-claro); }
.tag.ruim { background: #4D2420; border-color: #7A3A33; color: #F6C2B8; }
.dias { display: flex; flex-direction: column; gap: 8px; }
.dia { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; }
.dia > span { font-size: 13px; font-weight: 600; color: var(--giz-2); }
.dia .chips { margin-right: -16px; padding-right: 16px; }
.previa { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--giz-2); padding-top: 4px; }
.previa b { color: var(--giz); }
.grupo-plano { display: flex; flex-direction: column; gap: 8px; }
.grade-semana { display: grid; grid-template-columns: 1fr repeat(7, 32px); gap: 4px 3px; align-items: center; }
.grade-semana .cel.travado { display: block; height: 32px; border-radius: 8px; background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 4px, transparent 4px 8px); border: 1px dashed var(--linha); }
.grade-semana .cab.jogo, .grade-semana .cab.trav { color: var(--giz-2); opacity: .9; } .grade-semana .cab.jogo small { color: var(--ouro); }
.dia-jogo { color: var(--ouro) !important; }
.jogo-copa { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--linha); }
.jogo-copa span:last-child { text-align: right; } .jogo-copa > b, .jogo-copa > .sub { text-align: center; }
.jogo-copa.meu, .serie.meu .jogo-copa { color: var(--ouro-claro); }
.jogo-copa .venc { font-weight: 700; color: var(--giz); } .serie { padding: 2px 0 6px; } .serie small { display: block; font-size: 11px; }
tr.z-dir td:first-child { box-shadow: inset 3px 0 0 #74D394; } tr.z-play td:first-child { box-shadow: inset 3px 0 0 #E3B341; } tr.z-fora td { opacity: .7; }
.grade-semana .cab { text-align: center; font-size: 12px; font-weight: 700; color: var(--giz-2); line-height: 1.1; }
.grade-semana .cab small { display: block; font-size: 9px; font-weight: 600; color: var(--ouro); text-transform: uppercase; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.grade-semana .acao { font-size: 14px; font-weight: 600; line-height: 1.15; padding: 4px 0; }
.grade-semana .acao small { display: block; font-size: 11px; font-weight: 400; color: var(--giz-2); }
.cel { width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--linha); background: var(--campo); cursor: pointer; position: relative; }
.cel::after { content: ""; position: absolute; inset: 0; margin: auto; width: 10px; height: 10px; border-radius: 50%; background: var(--linha); }
.cel.ativo { background: var(--ouro); border-color: var(--ouro); }
.cel.ativo::after { background: var(--tinta); width: 12px; height: 12px; }

.abas { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 4px; gap: 4px; }
.abas button { background: none; border: 0; border-radius: 9px; padding: 9px 2px; font-weight: 600; font-size: 12.5px; color: var(--giz-2); cursor: pointer; }
.abas button.ativo { background: var(--ouro); color: var(--tinta); }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--giz-2); font-weight: 600; padding: 6px 4px; }
td { padding: 7px 4px; border-top: 1px solid var(--linha); }
td.n, th.n { text-align: right; }
tr.meu td { background: rgba(227, 179, 65, .14); font-weight: 700; color: var(--ouro-claro); }
.atrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; }
.aviso-mercado { display: flex; gap: 12px; align-items: center; text-align: left; cursor: pointer; border-color: var(--ouro); color: var(--giz); font: inherit; width: 100%; }
.aviso-mercado > span:first-child { font-size: 26px; } .aviso-mercado small { display: block; color: var(--giz-2); font-size: 13px; margin-top: 2px; }
.patro { border-color: var(--ouro); display: flex; flex-direction: column; gap: 10px; }
.patro-topo { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; } .logo-marca { display: block; border-radius: 8px; }
.patro-opcoes { display: grid; gap: 8px; }
.patro-op { text-align: left; font: inherit; color: var(--giz); background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.patro-op:hover { border-color: var(--ouro); } .patro-op b { color: var(--ouro); } .patro-op small { color: var(--giz-2); font-size: 12.5px; }
.cartaz-grande .cartaz { width: 100%; max-width: 360px; display: block; margin: 0 auto; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.patro-galeria { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.patro-item { display: flex; flex-direction: column; gap: 2px; } .patro-item .cartaz { width: 100%; border-radius: 10px; } .patro-item small { color: var(--giz-2); font-size: 12px; }
.card-jogador { cursor: pointer; transition: border-color .15s; } .card-jogador:hover { border-color: var(--ouro); } .ver-perfil { color: var(--ouro) !important; font-weight: 600; margin-top: 2px; }
.perfil { overflow-y: auto; }
.perfil-topo { position: relative; display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: center; padding: 18px 16px 16px; background: linear-gradient(135deg, var(--c1) 0%, color-mix(in srgb, var(--c1) 55%, #000) 100%); border-bottom: 4px solid var(--c2); }
.perfil-topo::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 26px, rgba(255,255,255,.06) 26px 40px); pointer-events: none; }
.perfil-foto svg { width: 96px; height: 115px; border-radius: 12px; display: block; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.perfil-nome { color: #FFF; text-shadow: 0 1px 3px rgba(0,0,0,.5); min-width: 0; } .perfil-nome h1 { font-size: 34px; margin: 2px 0 0; } .perfil-nome > span { font-size: 13px; opacity: .9; } .perfil-nome small { font-size: 12px; opacity: .9; }
.perfil-clube { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; font-size: 14px; } .perfil-clube .escudo { width: 18px; height: 21px; } .perfil-clube small { opacity: .8; }
.perfil-ovr { text-align: center; color: #FFF; z-index: 1; } .perfil-ovr strong { display: block; font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; } .perfil-ovr span { font-size: 11px; letter-spacing: .1em; } .perfil-ovr small { display: block; font-size: 11px; opacity: .85; margin-top: 4px; }
.perfil-topo > * { z-index: 1; }
.negocio { padding: 9px 0; border-bottom: 1px solid var(--linha); } .negocio.meu { background: rgba(227,179,65,.07); }
.neg-topo { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; } .neg-valor { font-weight: 700; color: var(--ouro-claro); white-space: nowrap; font-size: 13px; }
.neg-rota { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 13px; } .neg-clube { display: inline-flex; align-items: center; gap: 5px; } .neg-clube svg { width: 16px; height: 16px; } .seta { color: var(--giz-2); }
.premio-l { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--linha); font-size: 13px; } .premio-l .rotulo { margin: 0; }
.premio-l.largo { grid-template-columns: 112px 1fr auto; } .premio-l.ouro span:nth-child(2) { font-weight: 600; } .premio-l.ouro .rotulo { color: var(--ouro); }
.recorde { border-bottom: 1px solid var(--linha); padding: 8px 0; } .recorde summary { display: flex; justify-content: space-between; gap: 8px; cursor: pointer; font-size: 14px; list-style: none; } .recorde summary::-webkit-details-marker { display: none; } .recorde summary small { white-space: nowrap; color: var(--sub, #9aa); } .recorde[open] summary { margin-bottom: 4px; }
.despedida h1 { margin: 4px 0 6px; } .despedida .nivel-lenda { font-size: 20px; font-weight: 700; color: var(--ouro); margin: 6px 0 2px; } .despedida .botao { margin-top: 12px; width: 100%; }
.capas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } .capa-cel svg { width: 100%; height: auto; display: block; border-radius: 10px; }
.campinho { background: repeating-linear-gradient(180deg, #1f5a35 0 34px, #1b5230 34px 68px); border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; gap: 8px; }
.sel-linha { display: flex; justify-content: space-around; gap: 4px; }
.sel-j { flex: 1; max-width: 25%; display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 11px; line-height: 1.2; color: #fff; }
.sel-j svg { width: 20px; height: 22px; margin-bottom: 2px; } .sel-j .nome-hist, .sel-j b { font-size: 11px; color: #fff; } .sel-j small { color: rgba(255,255,255,.75); font-size: 10px; }
.sel-j.eu b { color: var(--ouro); }
.nome-hist { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; text-decoration: underline dotted rgba(255,255,255,.35); text-underline-offset: 3px; }
.hist-topo { display: flex; gap: 12px; align-items: center; padding-right: 40px; } .hist-topo h1 { margin: 2px 0; font-size: 26px; } .hist-topo small { color: var(--giz-2); }
.hist-topo .ovr { margin-left: auto; text-align: center; } .hist-topo .ovr strong { display: block; font-size: 30px; color: var(--ouro); } .hist-topo .ovr span { font-size: 11px; color: var(--giz-2); }
table.hist td { vertical-align: middle; } table.hist tr.mudou td { border-top: 1px solid var(--ouro); } .hist-clube { display: flex; align-items: center; gap: 6px; } .hist-clube svg { width: 18px; height: 18px; flex: none; }
.fechar { position: absolute; top: 8px; right: 10px; background: rgba(0,0,0,.35); color: #FFF; border: 0; width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer; z-index: 2; }
.perfil-corpo { padding: 16px; display: flex; flex-direction: column; gap: 10px; } .perfil-corpo .rotulo { margin-top: 10px; } .perfil-corpo .rotulo small { text-transform: none; letter-spacing: 0; font-weight: 500; opacity: .8; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1; color: var(--ouro); } .tile span { font-size: 11.5px; color: var(--giz-2); }
.radar { width: 100%; max-width: 360px; margin: 0 auto; display: block; }
.relatorio { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .relatorio > div { background: var(--campo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.relatorio small { color: var(--giz-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; } .relatorio b { color: var(--ouro); } .relatorio span { font-size: 13px; color: var(--giz-2); }
.chips-lista { display: flex; flex-wrap: wrap; gap: 6px; } .chip-info { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: var(--campo-2); border: 1px solid var(--linha); } .chip-info.pos { border-color: #2E7D4F; color: #BFF0D0; } .chip-info.neg { border-color: #8C3A30; color: #F6C2B8; }
.lista-clubes, .lista-titulos { display: flex; flex-direction: column; gap: 6px; }
.linha-clube { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--campo-2); border-radius: 10px; } .linha-clube .escudo { width: 22px; height: 26px; } .linha-clube small { display: block; color: var(--giz-2); font-size: 12px; } .linha-clube > span { font-size: 13px; color: var(--giz-2); }
.lista-titulos > div { display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; padding: 6px 10px; background: var(--campo-2); border-radius: 10px; } .lista-titulos span { grid-row: span 2; font-size: 18px; } .lista-titulos small { color: var(--giz-2); font-size: 12px; }
.bio { margin: 0; font-size: 15px; line-height: 1.55; color: var(--giz); background: var(--campo-2); border-left: 3px solid var(--ouro); border-radius: 0 12px 12px 0; padding: 12px 14px; }
.armario { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.trofeu-cel { background: linear-gradient(180deg, #24382F, var(--campo-2)); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--giz); font: inherit; cursor: pointer; }
.trofeu-cel svg { width: 44px; height: 54px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); } .trofeu-cel b { font-family: var(--display); font-size: 20px; color: var(--ouro); line-height: 1; } .trofeu-cel small { font-size: 10.5px; color: var(--giz-2); text-align: center; line-height: 1.2; }
.armario.camisas { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
.camisa-cel { background: linear-gradient(180deg, #24382F, var(--campo-2)); border: 1px solid var(--linha); border-radius: 12px; padding: 8px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--giz); font: inherit; cursor: pointer; }
.camisa-cel svg { width: 62px; height: 80px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); } .camisa-cel small { font-size: 10.5px; color: var(--giz-2); text-align: center; line-height: 1.2; }
.camisa-cel.apagada svg { filter: none; opacity: .8; } .camisa-cel.apagada small { opacity: .6; }
.camisa-cel.ativo { border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro); }
.trofeu-cel.ativo { border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro); }
.trofeu-detalhe { background: var(--campo-2); border: 1px solid var(--ouro); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; } .trofeu-detalhe > b { color: var(--ouro); margin-bottom: 2px; } .trofeu-detalhe span { display: inline-block; width: 44px; font-weight: 700; } .trofeu-detalhe small { color: var(--giz-2); }
.evento { border-color: #6FB7E0; } .evento h2 { margin: 2px 0 6px; } .evento .ferr-botoes { margin-top: 10px; flex-wrap: wrap; } .evento .botao small { display: block; font-size: 11.5px; opacity: .75; font-weight: 500; }
.kv b.pos { color: var(--pos); } .kv b.neg { color: var(--neg); }
.msg-mercado { padding: 10px 12px; border-radius: 10px; font-weight: 600; margin-bottom: 10px; } .msg-mercado.ok { background: #1F4D33; color: #BFF0D0; } .msg-mercado.nao { background: #4D2420; color: #F6C2B8; }

/* partida e resumo */

/* treino de posição */

.craque-linha { display: flex; align-items: center; gap: 10px; padding: 6px 0; } .craque-linha > div { flex: 1; min-width: 0; } .craque-linha small { display: block; color: var(--giz-2); font-size: 12px; }

.avatar-fam { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--campo-3); border: 2px solid var(--c); color: var(--giz); font: 800 14px var(--display); }
.busca-clubes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }

.perfil-app-txt small { color: var(--giz-2); font-size: 12.5px; }
.efeito-prof { color: var(--ouro-claro) !important; }
.perfil-app-botoes { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

@media (max-width: 420px) { .pos-linha { grid-template-columns: 100px 1fr 34px 24px 76px; font-size: 12px; } .rel-nivel { width: 86px; } .rel-acoes { margin-left: 0; } }

/* caminhos e convites */
