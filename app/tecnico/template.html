<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mycarrerinha Técnico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/*__ESTILO_BASE__*/
/* ---------------- modo técnico ---------------- */
.topo-clube { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; }
.topo-clube .escudo { width: 40px; height: 46px; }
.topo-clube b { font-family: var(--display); font-size: 22px; font-weight: 800; text-transform: uppercase; line-height: 1; display: block; }
.topo-clube small { color: var(--giz-2); font-size: 12.5px; }
.topo-clube .caixa { text-align: right; font-size: 12px; color: var(--giz-2); }
.topo-clube .caixa b { font-family: var(--texto); font-size: 15px; color: var(--giz); text-transform: none; }
.sub-abas { display: flex; gap: 6px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
.sub-abas button { flex: none; background: transparent; border: 1px solid var(--linha); color: var(--giz-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.sub-abas button.ativo { background: var(--ouro); border-color: var(--ouro); color: var(--tinta); font-weight: 700; }
.prox { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; margin: 10px 0; }
.prox .lado { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; line-height: 1.15; }
.prox .lado .escudo { width: 46px; height: 52px; }
.prox .x { font-family: var(--display); font-weight: 900; font-size: 28px; color: var(--giz-2); }
.prox .placar { font-family: var(--display); font-weight: 900; font-size: 40px; color: var(--ouro-claro); letter-spacing: .04em; }
.medidor { height: 8px; border-radius: 4px; background: var(--linha); overflow: hidden; margin: 6px 0 2px; }
.medidor i { display: block; height: 100%; border-radius: 4px; background: var(--c, var(--ouro)); width: var(--v); }
.lista { display: flex; flex-direction: column; }
.lin { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--linha); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit; width: 100%; cursor: pointer; font: inherit; }
.lin:last-child { border-bottom: 0; }
.lin .num { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--giz-2); text-align: center; }
.lin .nm { min-width: 0; }
.lin .nm b { display: block; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin .nm small { color: var(--giz-2); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.lin .ov { text-align: right; }
.lin .ov strong { font-family: var(--display); font-weight: 900; font-size: 24px; color: var(--ouro-claro); line-height: 1; display: block; }
.lin .ov span { font-size: 11px; color: var(--giz-2); }
.pill { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--campo-3); border: 1px solid var(--linha); color: var(--giz-2); }
.pill.ruim { background: #4D2420; border-color: #7A3A33; color: #F6C2B8; }
.pill.bom { background: #1F4D33; border-color: #2F7A4F; color: #BFF0D0; }
.pill.aviso { background: #4A3C14; border-color: var(--ouro-escuro); color: var(--ouro-claro); }
.mini-barra { display: inline-block; width: 38px; height: 5px; border-radius: 3px; background: var(--linha); vertical-align: middle; overflow: hidden; }
.mini-barra i { display: block; height: 100%; width: var(--v); background: var(--c); }
.campo { position: relative; width: 100%; aspect-ratio: 68 / 96; border-radius: 14px; overflow: hidden; background: repeating-linear-gradient(180deg, #1E6B3E 0 9.09%, #1B6239 9.09% 18.18%); border: 2px solid #2F8A55; }
.campo::before { content: ""; position: absolute; inset: 4%; border: 2px solid rgba(255,255,255,.35); border-radius: 4px; }
.campo::after { content: ""; position: absolute; left: 4%; right: 4%; top: 50%; border-top: 2px solid rgba(255,255,255,.35); }
.campo .area { position: absolute; left: 28%; right: 28%; height: 13%; border: 2px solid rgba(255,255,255,.35); }
.campo .area.cima { top: 4%; border-top: 0; } .campo .area.baixo { bottom: 4%; border-bottom: 0; }
.campo .circ { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.35); border-radius: 50%; }
.vaga { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; cursor: pointer; color: #fff; z-index: 2; width: 74px; padding: 0; }
.vaga .bola { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 17px; border: 2px solid #0A0A0A; box-shadow: 0 2px 6px rgba(0,0,0,.45); }
.vaga .nomev { font-size: 11px; font-weight: 700; background: rgba(0,0,0,.6); padding: 1px 5px; border-radius: 6px; max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vaga .notav { font-size: 10.5px; font-weight: 700; color: #FFE7A3; text-shadow: 0 1px 2px #000; }
.vaga.vazia .bola { background: rgba(0,0,0,.35) !important; color: #fff; border-style: dashed; border-color: #fff; }
.vaga.alerta .bola { box-shadow: 0 0 0 3px #EC7D69; }
.grade-tat { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.pagina > *, .tela-aba, .grade-tat > * { min-width: 0; }
.tela-aba .chips { margin-right: -16px; padding-right: 16px; }
.grade-tat .lbl { font-size: 12.5px; color: var(--giz-2); font-weight: 600; margin-bottom: 4px; }
.forca3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.forca3 div { background: var(--campo-3); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 4px; }
.forca3 strong { display: block; font-family: var(--display); font-size: 26px; font-weight: 900; color: var(--ouro-claro); line-height: 1; }
.forca3 span { font-size: 11px; color: var(--giz-2); text-transform: uppercase; letter-spacing: .08em; }
table.tab { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.tab th { font-size: 11px; color: var(--giz-2); text-transform: uppercase; letter-spacing: .06em; text-align: center; padding: 6px 2px; font-weight: 600; }
table.tab td { padding: 7px 2px; border-top: 1px solid var(--linha); text-align: center; }
table.tab td.cl { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
table.tab tr.eu td { background: color-mix(in srgb, var(--ouro) 14%, transparent); font-weight: 700; }
table.tab tr.sobe td:first-child { box-shadow: inset 3px 0 0 #74D394; } table.tab tr.cai td:first-child { box-shadow: inset 3px 0 0 #EC7D69; }
.esc-p { width: 18px; height: 21px; vertical-align: -5px; margin-right: 5px; }
.dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.dl span { color: var(--giz-2); } .dl b { text-align: right; font-variant-numeric: tabular-nums; }
.dl .pos { color: var(--pos); } .dl .neg { color: var(--neg); }
.botoes { display: flex; flex-wrap: wrap; gap: 8px; }
.aviso-t { padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--campo-3); border: 1px solid var(--linha); }
.aviso-t.ok { border-color: #2F7A4F; } .aviso-t.erro { border-color: #7A3A33; }
.evento { display: grid; grid-template-columns: 34px 22px 1fr; gap: 6px; font-size: 14px; padding: 5px 0; border-bottom: 1px solid var(--linha); }
.evento .m { color: var(--giz-2); font-variant-numeric: tabular-nums; text-align: right; }
.evento.adv { color: var(--giz-2); }
.not { font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--linha); } .not small { display: block; color: var(--giz-2); font-size: 11.5px; }
.estrelas { color: var(--ouro); letter-spacing: 1px; }
.form-ini { display: grid; gap: 10px; }
.form-ini label { display: grid; gap: 4px; font-size: 13px; color: var(--giz-2); font-weight: 600; }
.form-ini input, .form-ini select, select.campo-sel { background: var(--campo-3); color: var(--giz); border: 1px solid var(--linha); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; }
.clube-op { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--linha); }
.clube-op .escudo { width: 28px; height: 32px; }
.clube-op.trancado { opacity: .5; }
dialog { background: var(--campo-2); color: var(--giz); border: 1px solid var(--linha); border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog .tela { padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.fechar { position: absolute; top: 10px; right: 10px; background: var(--campo-3); border: 1px solid var(--linha); color: var(--giz); border-radius: 99px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; }
.campo-valor { display: flex; align-items: center; gap: 8px; background: var(--campo-3); border: 1px solid var(--linha); border-radius: 10px; padding: 0 12px; margin-top: 6px; }
.campo-valor:focus-within { border-color: var(--ouro); }
.campo-valor span { color: var(--giz-2); font-weight: 700; }
.campo-valor input { flex: 1; min-width: 0; background: none; border: 0; color: var(--giz); font: inherit; font-size: 18px; font-weight: 700; padding: 11px 0; outline: none; font-variant-numeric: tabular-nums; }
.estadio-box { margin: 0 -16px 10px; } .estadio-box svg { width: 100%; height: auto; display: block; border-radius: 12px; }
.atr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
@media (max-width: 380px) { .atr { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="pagina" id="app"></main>
<dialog id="dlg"><div class="tela" id="tela" style="position:relative"></div></dialog>
<script>/*__SCRIPT__*/</script>
</body>
</html>
